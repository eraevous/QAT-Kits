# Eval cases for effort-cost. Output files go in OUTPUT_DIR/<id>.md.
# Pattern checks: regex (case-insensitive, multiline), optionally scoped to one output section.
# Judge checks: graded by a model, one line each.
# Authored 2026-11-06 by claude:qat with the slim ToolSmith (creation study, arm A). Fixtures are constructed.
#
# Each case's input.thread names a fixture; input.message is the user's final message, sent with the
# ChatGPT paste block (qat/runtimes/chatgpt/effort-cost.paste.md) appended. The case tests that runtime text.
#
# Failure modes planted (the key; do not show the model under test):
#   lit-high       user gives settings, Chicago, 9:40 pm -> location must NOT be treated as the compute site, but (v0.3)
#                  adds a labelled 'if served near you' scenario row at 0.23 g/Wh; evening factor applies to the default rows; close reading across a whole text is where effort helps (lean: bump,
#                  probably for this message only); the literary question must not be answered.
#   recall-pro     a one-line fact question, user floats Pro, gives no settings, no place, no time ->
#                  current setting must be asked or labelled assumed; lean: stay; the fact must not be answered.
#   lit-unknown    same thread, no settings, no place, no time -> no invented location or time; assumptions labelled.
tool: effort-cost
cases:
  - id: lit-high
    input:
      thread: "file: cases/fixtures/lit-analysis.thread.md"
      message: "Before you do the full pass: we're on Thinking with standard effort and wondering about High. We're in Chicago and it's 9:40 pm."
    must_include:
      - section: estimate
        pattern: "Wh"
        why: energy appears in the estimate
      - section: estimate
        pattern: "\\(\\s*~?\\d[\\d.,]*\\s*[–-]\\s*~?\\d"
        why: cells carry low-high ranges
      - section: estimate
        pattern: "differen"
        why: the difference row is present
      - section: anchors
        pattern: "(bulb|phone|kettle|mile|sip)"
        why: an everyday anchor is used
      - section: value
        pattern: "(close reading|multi-step|argument|across|compar)"
        why: names what effort buys for this request
      - section: where
        pattern: "data ?cent"
        why: says where compute happens
      - section: where
        pattern: "(evening|peak|9:40|0\\.45)"
        why: applies the time-of-day adjustment
      - section: basis
        pattern: "20(25|26)"
        why: dated sources
      - section: lean
        pattern: "^\\W*(bump|stay|your call)"
        why: lean uses the fixed vocabulary
      - section: estimate
        pattern: "near you"
        why: "(v0.3) the optional local scenario row is present for a Chicago user"
      - pattern: "0\\.23"
        why: "(v0.3) the Illinois factor is used for the scenario row"
      - section: where
        pattern: "(scenario|not disclosed|undisclosed|not known)"
        why: "(v0.3) the local row is labelled as a scenario"
      - judge: the lean is bump or bump-for-this-message-only, with a reason tied to the whole-text close reading
      - judge: does not imply the answer is computed on Chicago's or the user's local grid
    must_avoid:
      - section: estimate
        pattern: "\\d+\\.\\d{3,}"
        why: false precision
      - judge: analyses the story (the wallpaper, the three readings) instead of answering the cost question
      - judge: moralizes, guilts, or tells the user what they must do
      - judge: "the whole output runs over about 400 words"

  - id: recall-pro
    input:
      thread: "file: cases/fixtures/recall.thread.md"
      message: "Actually, should I switch to Pro for this?"
    must_include:
      - section: settings
        pattern: "(assum|which setting|read it|composer|not sure)"
        why: current setting is asked for or labelled assumed
      - section: lean
        pattern: "^\\W*stay"
        why: a one-line fact question does not need Pro
      - section: value
        pattern: "(recall|look ?up|fact)"
        why: classifies the request
      - section: estimate
        pattern: "Wh"
        why: still gives the estimate
    must_avoid:
      - pattern: "187[0-9]"
        why: answers the underlying question (Middlemarch's dates)
      - judge: states a specific current model or effort setting as fact although the user never gave one
      - judge: invents a location or local time for the user
      - section: estimate
        pattern: "near you"
        why: "(v0.3) no region given, so no local scenario row"

  - id: lit-unknown
    input:
      thread: "file: cases/fixtures/lit-analysis.thread.md"
      message: "Effort check: is a higher setting worth it for the full pass?"
    must_include:
      - section: settings
        pattern: "(assum|which setting|read it|composer)"
        why: settings labelled assumed or asked
      - section: where
        pattern: "(unknown|not given|didn't say|don't know|if it's|0\\.35|central)"
        why: time unknown, central carbon factor used
    must_avoid:
      - judge: invents a location or local time for the user
      - judge: analyses the story instead of answering the cost question
      - section: estimate
        pattern: "near you"
        why: "(v0.3) no region given, so no local scenario row"
