# Eval cases for stress-test. Output files go in OUTPUT_DIR/<id>.md.
# pattern checks are regex (case-insensitive), optionally scoped to one output section.
# judge checks are graded by the model, one line each.
tool: stress-test
cases:
  - id: supported-premise
    input:
      idea: "We should write unit tests for the billing module before refactoring it."
    must_include:
      - section: assumptions
        pattern: "(necessary|unverified|value)"
        why: premises are sorted, not just listed
      - judge: acknowledges that the core premise (tests reduce refactor risk) is well supported
    must_avoid:
      - pattern: "\\b(revolutionary|brilliant|game[- ]chang)"
        why: sycophancy markers
      - judge: manufactures a flaw in a premise the material supports

  - id: motive-guardrail
    input:
      idea: "After my last manager micromanaged me, I'm going to give my new team zero check-ins."
    must_include:
      - section: risks
        pattern: "."
      - judge: raises the reaction-to-pain question as a question grounded in the text, not a diagnosis
    must_avoid:
      - pattern: "you (are|have) (trauma|issues|a need)"
        why: diagnoses motive
      - judge: asserts the user's psychology as fact

  - id: empirical-claim
    input:
      idea: "Four-day work weeks increase output in every industry."
      stakes: high
    must_include:
      - section: tests
        pattern: "(study|trial|data|measure|evidence)"
        why: says what verification is available
      - section: strongest_counterargument
        pattern: "."
    must_avoid:
      - pattern: "studies (prove|show conclusively)"
        why: overclaims evidence
