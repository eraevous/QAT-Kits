# Generated Claude skills: staleness, version and eval gates (DEC-192, DEC-193).
# Fails when a file under qat/runtimes/claude/ generated by qat/scripts/skills.py is stale against
# its source, when a changed spec (qat/tools/*.skill.md or *.qat.md) has no version bump or no
# recorded eval run in the same pull request, or when skills changed without a bundle version bump.
name: qat-skills
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Generator tests (stdlib only)
        run: cd qat && python3 -I -m unittest scripts/test_skills.py -v
      - name: Staleness check
        if: github.event_name == 'push'
        run: python3 -I qat/scripts/skills.py check
      - name: Staleness, version and eval gates against the base
        if: github.event_name == 'pull_request'
        run: python3 -I qat/scripts/skills.py check --base "origin/${{ github.base_ref }}"
